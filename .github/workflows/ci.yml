name: ci

on:
  push:
  pull_request:

env:
  OPENBLAS_NUM_THREADS: "1"
  PYTHONHASHSEED: "0"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Format
        run: ruff format --check src tests scripts
      - name: Lint
        run: ruff check src tests scripts
      - name: Type check
        run: mypy
      - name: Scope test IDs present (T001-T055)
        run: python scripts/check_test_ids.py
      - name: Secret scan
        run: python scripts/secret_scan.py

  tests:
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Unit, property, integration (mocks only, no network), replay, acceptance, security
        run: pytest -q -p no:cacheprovider --cov=cma --cov-report=json:coverage.json --cov-report=term
      - name: Coverage thresholds (domain/accounting/simulator/risk >= 90%, core >= 80%)
        run: python scripts/check_coverage.py coverage.json
      - name: Fixtures are reproducible
        run: |
          python scripts/generate_fixtures.py
          git diff --exit-code -- tests/fixtures
      - name: Migration test from empty database
        run: cma db migrate --db-url sqlite:///ci-empty.sqlite
      - name: Paper-mode smoke test against mocks
        run: cma smoke
      - name: Live order routing must fail hard in v1
        run: |
          set +e
          cma live --config config/base.yaml
          test $? -eq 3
