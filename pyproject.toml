[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cross-market-alpha"
version = "0.1.0"
description = "Research-first paper-trading platform testing whether faster markets lead prediction-market repricing"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.13",
  "pyarrow>=16",
  "pyyaml>=6",
  "pydantic>=2.7",
  "httpx>=0.27",
  "websockets>=13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "hypothesis>=6.100",
  "mypy>=1.10",
  "ruff>=0.6",
  "types-PyYAML",
  "pandas-stubs",
  "scipy-stubs",
  "cryptography>=42",   # exercises Kalshi request signing in tests
]
postgres = ["psycopg[binary]>=3.1"]
kalshi-auth = ["cryptography>=42"]

[project.scripts]
cma = "cma.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
cma = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
  "unit: fast deterministic unit tests",
  "property: hypothesis property/invariant tests",
  "integration: multi-component tests against mocks/fixtures (no network)",
  "replay: deterministic replay tests",
  "acceptance: experiment/report acceptance gates",
  "security: live-trading and secret-handling guarantees",
  "slow: longer-running tests",
]
filterwarnings = ["error::DeprecationWarning:cma.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "PL", "N", "C4", "PT", "DTZ"]
ignore = [
  "PLR0911", "PLR0912", "PLR0913", "PLR0915", "PLR2004", "PLR0904", "PLC0415",
  "RUF001", "RUF002", "RUF003", "N818", "SIM108", "PLW2901",
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "S101", "N802", "PLC2701", "DTZ001", "N806", "N999", "PT018", "PLR0917", "PT011", "C408"]
"src/cma/research/report_html.py" = ["E501"]
"scripts/**" = ["DTZ005", "N802", "PLR0917"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true
mypy_path = "src"
packages = ["cma"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyarrow.*", "websockets.*", "hypothesis.*"]
ignore_missing_imports = true

[tool.coverage.run]
source = ["cma"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "\\.\\.\\.",
]
